name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets, tokens, private repo names, and personal data before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the actual result and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Local development
        - Self-hosted with Docker
        - Public deployment
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data.
      render: shell

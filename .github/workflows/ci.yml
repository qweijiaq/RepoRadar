name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://radar:radar@localhost:5433/radar
      TEST_DATABASE_URL: postgres://radar:radar@localhost:5433/radar
      AUTH_SECRET: ci-only-not-a-production-secret
      ADMIN_LOGINS: ci-admin
      SETUP_TOKEN: ci-setup-token
      AUTH_DEV_MODE: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Migrations
        run: pnpm db:migrate
      - name: Database integration tests
        run: pnpm test:db
      - run: pnpm build
      - name: Production smoke (next start)
        run: pnpm smoke:prod
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          AUTH_DEV_MODE: "1"
          ADMIN_LOGINS: demo
          AUTH_SECRET: ci-e2e-secret-not-production
          NEXT_DIST_DIR: .next-e2e
          METRICS_TOKEN: ""
          RADAR_INLINE_JOBS: "0"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

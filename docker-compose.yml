services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: radar
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - radar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: worker
    command: ["/app/node_modules/.bin/tsx", "/app/apps/worker/src/cli.ts", "migrate"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://radar:${POSTGRES_PASSWORD:-radar}@postgres:5432/radar
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://radar:${POSTGRES_PASSWORD:-radar}@postgres:5432/radar
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_DEV_MODE: "0"
      RADAR_INLINE_JOBS: "0"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      target: worker
    working_dir: /app/apps/web
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://radar:${POSTGRES_PASSWORD:-radar}@postgres:5432/radar
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      RADAR_INLINE_JOBS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.kill(1, 0)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      RADAR_DOMAIN: ${RADAR_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  radar-pgdata:
  caddy-data:
  caddy-config:
